[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capchuh"
version = "0.1.0"
description = "Measure the generic-ness of text to distinguish AI-generated content from human-generated content."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.7",
    "numpy>=1.24",
]

[project.scripts]
capchuh = "capchuh.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
